server {
    listen 80;
    listen [::]:80;
    
    server_name localhost zewalo.test *.zewalo.test;
    root /var/www/public;
    
    index index.php index.html index.htm;
    
    charset utf-8;
    
    # Max upload size
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # NOTE: Do NOT add `error_page 404 /index.php;` here. `location /` already
    # routes every request to index.php via try_files, so Laravel emits proper
    # 404s. Re-dispatching those 404s back to index.php creates an infinite
    # internal-redirect loop that hangs the worker until the FastCGI timeout
    # (any unknown URL — and any auth redirect to a missing login route — hangs).

    # PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouts
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
    
    # Deny access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }
    
    # The admin PWA service worker is a dynamic PHP route, not a static file.
    # Without this exact-match (which outranks the .js regex below), nginx serves
    # it via `error_page 404 /index.php` but keeps the 404 status, which breaks
    # service-worker registration (the browser requires a 200). Route it to PHP.
    location = /admin/sw.js {
        try_files $uri /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Storage symlink
    location /storage {
        alias /var/www/storage/app/public;
    }
}
